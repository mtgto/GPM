query Me {
  viewer {
    login
  }
}

query OrganizationProjectOverview($login: String!, $number: Int!) {
  organization(login: $login) {
    projectV2(number: $number) {
      ...ProjectOverview
      views(first: 100) {
        nodes {
          ...ProjectViewOverview
        }
      }
    }
  }
}

query ViewerProjectOverview($number: Int!) {
  viewer {
    projectV2(number: $number) {
      ...ProjectOverview
      views(first: 100) {
        nodes {
          ...ProjectViewOverview
        }
      }
    }
  }
}

fragment ProjectOverview on ProjectV2 {
  id
  title
  url
}

fragment ProjectViewOverview on ProjectV2View {
  id
  name
  layout
  verticalGroupByFields(first: 100) {
    nodes {
      ... on ProjectV2FieldCommon {
        name
      }
    }
  }
}
