query Me {
  viewer {
    login
  }
}

query OrganizationProjectOverview($login: String!, $number: Int!) {
  organization(login: $login) {
    projectV2(number: $number) {
      ...ProjectOverview
      views(first: 100) {
        nodes {
          ...ProjectViewOverview
        }
      }
    }
  }
}

query ViewerProjectOverview($number: Int!) {
  viewer {
    projectV2(number: $number) {
      ...ProjectOverview
      views(first: 100) {
        nodes {
          ...ProjectViewOverview
        }
      }
    }
  }
}

fragment ProjectOverview on ProjectV2 {
  id
  title
  url
  # TODO: Support other column field
  field(name: "Status") {
    ... on ProjectV2SingleSelectField {
      options {
        name
        description
        color
      }
    }
  }
}

fragment ProjectViewOverview on ProjectV2View {
  id
  name
  layout
  verticalGroupByFields(first: 100) {
    nodes {
      ... on ProjectV2FieldCommon {
        name
      }
    }
  }
}
