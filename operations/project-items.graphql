query OrganizationProjectItems($login: String!, $number: Int!, $after: String) {
  organization(login: $login) {
    projectV2(number: $number) {
      items(after: $after, first: 100) {
        nodes {
          ...ProjectItemOverview
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}

query ViewerProjectItems($number: Int!, $after: String) {
  viewer {
    projectV2(number: $number) {
      items(after: $after, first: 100) {
        nodes {
          ...ProjectItemOverview
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}

fragment ProjectItemOverview on ProjectV2Item {
  id
  content {
    __typename
    ... on DraftIssue {
      title
    }
    ... on Issue {
      title
      issueState: state
      number
      repository {
        name
      }
    }
    ... on PullRequest {
      title
      pullRequestState: state
      number
      repository {
        name
      }
    }
  }
  # TODO: Support other column field
  status: fieldValueByName(name: "Status") {
    ...ColumnField
  }
}

fragment ColumnField on ProjectV2ItemFieldValue {
  ... on ProjectV2ItemFieldSingleSelectValue {
    id
    color
    name
    description
  }
}
